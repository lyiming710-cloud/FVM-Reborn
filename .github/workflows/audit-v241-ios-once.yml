name: Audit v2.4.1 iOS integration once

on:
  push:
    branches:
      - merge-v241-ios-20260913
    paths:
      - .github/workflows/audit-v241-ios-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: merge-v241-ios-20260913
          fetch-depth: 0

      - name: Audit changed runtime events and native usage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Spring-SG/FVM-Reborn.git || true
          git fetch upstream main
          BASE=5c4fe15d05dd49c8f6990bc3cabf3a6e1efc70bc
          UPSTREAM=0e9f83aa18d1fe49500f5d081074c950a9e21988
          test "$(git rev-parse upstream/main)" = "$UPSTREAM"

          python3 <<'PY'
          from pathlib import Path
          import subprocess, re

          BASE='5c4fe15d05dd49c8f6990bc3cabf3a6e1efc70bc'
          UP='0e9f83aa18d1fe49500f5d081074c950a9e21988'
          changed = subprocess.check_output(['git','diff','--name-only',BASE,UP], text=True).splitlines()
          gml = [p for p in changed if p.endswith('.gml') and Path(p).exists()]

          def code_prefix(text, n=900):
              lines=[]
              for line in text.splitlines():
                  s=line.strip()
                  if not s or s.startswith('//') or s.startswith('///'):
                      continue
                  lines.append(s)
                  if len('\n'.join(lines)) >= n:
                      break
              return '\n'.join(lines)

          event_candidates=[]
          no_pause=[]
          for p in gml:
              name=Path(p).name
              if name.startswith('Step_') or name.startswith('Collision_'):
                  txt=Path(p).read_text(encoding='utf-8', errors='replace')
                  event_candidates.append(p)
                  pref=code_prefix(txt)
                  if 'global.is_paused' not in pref:
                      no_pause.append(p)

          native=[]
          for p in gml:
              txt=Path(p).read_text(encoding='utf-8', errors='replace')
              if 'native_' in txt or 'global.native_util' in txt:
                  native.append(p)

          report=[]
          report += ['# v2.4.1 iOS integration static audit','',f'Upstream range: {BASE}..{UP}',f'Changed GML: {len(gml)}',f'Changed Step/Collision events: {len(event_candidates)}','']
          report += ['## Changed Step/Collision events without early pause reference']
          report += no_pause or ['NONE']
          report += ['', '## Changed GML with Windows-native references']
          report += native or ['NONE']
          report += ['', '## All changed Step/Collision events']
          report += event_candidates
          Path('.github/v241-ios-audit.txt').write_text('\n'.join(report)+'\n', encoding='utf-8')
          print('\n'.join(report))
          PY

          git add .github/v241-ios-audit.txt
          git commit -m "Record v2.4.1 iOS static audit"
          git push origin HEAD:merge-v241-ios-20260913
