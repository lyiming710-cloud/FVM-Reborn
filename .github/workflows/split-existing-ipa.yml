name: Split existing unsigned IPA

on:
  push:
    paths:
      - ".github/workflows/split-existing-ipa.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  split-ipa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download existing IPA artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9719594215/zip"             -o work/artifact.zip
          unzip -q work/artifact.zip -d work/artifact
          IPA="$(find work/artifact -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA" ]; then
            echo "::error::No IPA found in source artifact"
            find work/artifact -maxdepth 3 -type f -print
            exit 1
          fi
          cp "$IPA" work/FVM-Reborn-unsigned.ipa
          sha256sum work/FVM-Reborn-unsigned.ipa | tee work/FVM-Reborn-unsigned.ipa.sha256
          ls -lh work/FVM-Reborn-unsigned.ipa

      - name: Split IPA into downloadable chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/chunks
          split -b 300M -a 2 work/FVM-Reborn-unsigned.ipa work/chunks/FVM-Reborn-unsigned.ipa.part-
          ls -lh work/chunks
          test -f work/chunks/FVM-Reborn-unsigned.ipa.part-aa
          test -f work/chunks/FVM-Reborn-unsigned.ipa.part-ab
          test -f work/chunks/FVM-Reborn-unsigned.ipa.part-ac

      - name: Upload part aa
        uses: actions/upload-artifact@v4
        with:
          name: FVM-IPA-part-aa
          path: work/chunks/FVM-Reborn-unsigned.ipa.part-aa
          compression-level: 0
          retention-days: 7

      - name: Upload part ab
        uses: actions/upload-artifact@v4
        with:
          name: FVM-IPA-part-ab
          path: work/chunks/FVM-Reborn-unsigned.ipa.part-ab
          compression-level: 0
          retention-days: 7

      - name: Upload part ac
        uses: actions/upload-artifact@v4
        with:
          name: FVM-IPA-part-ac
          path: work/chunks/FVM-Reborn-unsigned.ipa.part-ac
          compression-level: 0
          retention-days: 7

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: FVM-IPA-checksum
          path: work/FVM-Reborn-unsigned.ipa.sha256
          retention-days: 7
