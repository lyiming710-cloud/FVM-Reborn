name: Finalize upstream merge once

on:
  push:
    branches:
      - merge-upstream-runner-2026-09-10
    paths:
      - .github/workflows/finalize-upstream-merge.yml

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: merge-upstream-runner-2026-09-10
          fetch-depth: 0

      - name: Reconcile suppressed upstream interaction changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'objects/obj_battle_pause_manager/Step_2.gml',
              'if (keyboard_check_pressed(vk_space) || virtual_pause_pressed) {',
              'if (keyboard_check_pressed(vk_space) || virtual_pause_pressed || (mouse_check_button_pressed(mb_left) && global.game_over)) {'
          )

          replace_once(
              'objects/obj_level_preview/Step_0.gml',
              'if keyboard_check_pressed(vk_escape){\n    keyboard_clear(vk_escape);\n\n\t    instance_destroy();\n}\n',
              'var _preview_esc = keyboard_check_pressed(vk_escape);\nvar _preview_right_click = mouse_check_button_pressed(mb_right);\nif (_preview_esc || _preview_right_click){\n    if (_preview_esc) keyboard_clear(vk_escape);\n    if (_preview_right_click) mouse_clear(mb_right);\n    instance_destroy();\n}\n'
          )

          replace_once(
              'objects/obj_readyroom_manager/Step_0.gml',
              'if (keyboard_check_pressed(vk_escape)) {',
              'var _readyroom_esc = keyboard_check_pressed(vk_escape);\nvar _readyroom_right_click = mouse_check_button_pressed(mb_right);\nif (_readyroom_esc || _readyroom_right_click) {'
          )
          replace_once(
              'objects/obj_readyroom_manager/Step_0.gml',
              '    // Consume this ESC so obj_quit_confirm/obj_level_preview cannot process\n    // the exact same edge and leave a ghost modal behind.\n    keyboard_clear(vk_escape);',
              '    // Consume the triggering edge so another object cannot process it in the same frame.\n    if (_readyroom_esc) keyboard_clear(vk_escape);\n    if (_readyroom_right_click) mouse_clear(mb_right);'
          )

          replace_once(
              'objects/obj_readyroom_manager/Draw_0.gml',
              'draw_text(1820,1080,"按ESC退出")',
              'draw_text(1820,1080,"右键点击或按ESC退出")'
          )

          replace_once(
              'objects/obj_text_input/Mouse_53.gml',
              '    if (os_type == os_windows) {\n        native_disable_ime();\n    }',
              '    if (os_type == os_windows && global.ime_block && native_disable_ime != undefined) {\n        native_disable_ime(window_handle());\n    }'
          )

          replace_once(
              'objects/obj_game_init/Create_0.gml',
              'if (os_type == os_windows) {\n    native_disable_ime();\n}',
              'if (os_type == os_windows && global.ime_block && native_disable_ime != undefined) {\n    native_disable_ime(window_handle());\n}'
          )
          PY

      - name: Remove one-shot merge helpers and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/merge-upstream-once.yml
          rm -f .github/workflows/finalize-upstream-merge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reconcile v2.4.0 interactions with iOS adaptations"
          git push origin HEAD:merge-upstream-runner-2026-09-10

      - name: Trigger iOS integration build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-ios-ipa.yml --ref merge-upstream-runner-2026-09-10
