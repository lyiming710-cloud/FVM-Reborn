name: Reconcile v2.4.1 with iOS once

on:
  push:
    branches:
      - merge-v241-ios-20260913
    paths:
      - .github/workflows/reconcile-v241-ios-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: merge-v241-ios-20260913
          fetch-depth: 0

      - name: Reconcile semantic conflicts and iOS platform guards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Spring-SG/FVM-Reborn.git || true
          git fetch upstream main
          test "$(git rev-parse upstream/main)" = "0e9f83aa18d1fe49500f5d081074c950a9e21988"

          python3 <<'PY'
          from pathlib import Path
          import subprocess

          def upstream(path):
              return subprocess.check_output(["git", "show", f"upstream/main:{path}"], text=True)

          # 1. Take upstream native v7.3 + archive extraction, then restore the
          # fork's backup-restore path traversal protections.
          path = "FvmNativeSupport/FvmNativeSupport/entry.h"
          text = upstream(path)
          begin = '  for (const auto &file_entry : backup_json["files"]) {'
          data_line = '    std::vector<uint8_t> data(content.begin(), content.end());'
          start = text.index(begin)
          data_pos = text.index(data_line, start)
          end = data_pos + len(data_line)
          hardened = '''  for (const auto &file_entry : backup_json["files"]) {
            if (!file_entry.contains("name") || !file_entry["name"].is_string() ||
                !file_entry.contains("content") ||
                !file_entry["content"].is_string()) {
              return FailWith(NativeError::JsonParseFailed,
                              "RestoreBackupWithTargetFile: invalid file entry");
            }
            std::string name = file_entry["name"];
            std::string content = file_entry["content"];

            fs::path relative_name(FileSystem::Utf8ToUtf16(name.c_str()));
            if (relative_name.empty() || relative_name.has_root_path() ||
                relative_name.has_parent_path() ||
                relative_name.filename() != relative_name ||
                relative_name == fs::path(L".") || relative_name == fs::path(L"..")) {
              return FailWith(
                  NativeError::InvalidArgument,
                  "RestoreBackupWithTargetFile: unsafe backup file name");
            }

            fs::path saves_root = fs::weakly_canonical(fs::path(w_saves_dir), ec);
            if (ec) {
              return FailWith(ec.value(),
                              "RestoreBackupWithTargetFile: canonical root failed");
            }
            fs::path file_path = (saves_root / relative_name).lexically_normal();
            fs::path relative_check = file_path.lexically_relative(saves_root);
            if (relative_check.empty() || relative_check.has_root_path() ||
                *relative_check.begin() == fs::path(L"..")) {
              return FailWith(
                  NativeError::InvalidArgument,
                  "RestoreBackupWithTargetFile: destination escaped save root");
            }

            std::vector<uint8_t> data(content.begin(), content.end());'''
          Path(path).write_text(text[:start] + hardened + text[end:], encoding="utf-8")

          # 2. Take upstream dynamic IME state handling, but make every native IME
          # reference Windows-only so the persistent manager remains safe on iOS.
          path = "objects/obj_file_manager/Step_0.gml"
          text = upstream(path)
          marker = "// 输入法屏蔽心跳"
          idx = text.index(marker)
          prefix, ime = text[:idx], text[idx:]
          ime = "\n".join(("    " + line) if line else line for line in ime.splitlines())
          Path(path).write_text(prefix + "if (os_type == os_windows) {\n" + ime + "\n}\n", encoding="utf-8")

          # 3. Take upstream centralized IME ownership but retain the iOS unified
          # pointer coordinates for tapping a text field.
          path = "objects/obj_text_input/Mouse_53.gml"
          text = upstream(path)
          click = 'if (point_in_rectangle(mouse_x, mouse_y, x, y, x + width, y + height)) {'
          if click not in text:
              raise SystemExit("obj_text_input click expression not found")
          pointer = '''var _click_x = (os_type == os_ios && global.pointer_input.device_only)
              ? global.pointer_input.x : mouse_x;
          var _click_y = (os_type == os_ios && global.pointer_input.device_only)
              ? global.pointer_input.y : mouse_y;
          if (point_in_rectangle(_click_x, _click_y, x, y, x + width, y + height)) {'''
          text = text.replace(click, pointer, 1)
          Path(path).write_text(text, encoding="utf-8")

          # 4. Take upstream Laboratory local/online UX. Online package management
          # currently requires the Windows native unzip implementation, so iOS gets
          # a notice instead of dereferencing undefined global.native_util.
          path = "objects/LaboratoryGUI/Create_0.gml"
          text = upstream(path)
          open_prefix = '''function open_online_gui() {
              if (!is_local_mode()) {
                  return
              }
          '''
          guarded_prefix = '''function open_online_gui() {
              if (!is_local_mode()) {
                  return
              }
              if (os_type != os_windows) {
                  show_notice("在线实验室地图下载目前仅支持 Windows", 120)
                  return
              }
          '''
          if open_prefix not in text:
              raise SystemExit("LaboratoryGUI online entry block not found")
          text = text.replace(open_prefix, guarded_prefix, 1)
          target = '                var _target = global.native_util.get_path_in_local_appdata("\\\\FVM_Reborn\\\\laboratory")'
          if target not in text:
              raise SystemExit("LaboratoryGUI native folder call not found")
          guarded_target = '''                if (os_type != os_windows) {
                              show_notice("当前平台暂不支持直接打开实验室文件夹", 120)
                              return
                          }
          ''' + target
          text = text.replace(target, guarded_target, 1)
          Path(path).write_text(text, encoding="utf-8")
          PY

          git add FvmNativeSupport/FvmNativeSupport/entry.h \
                  objects/obj_file_manager/Step_0.gml \
                  objects/obj_text_input/Mouse_53.gml \
                  objects/LaboratoryGUI/Create_0.gml
          git diff --cached --check
          git commit -m "Reconcile v2.4.1 interactions with iOS adaptations"
          git push origin HEAD:merge-v241-ios-20260913
