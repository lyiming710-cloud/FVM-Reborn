name: Merge upstream v3.0.0 and iOS customizations
on:
  push:
    branches:
      - sync/upstream-v3.0.0-base
    paths:
      - .github/workflows/sync-upstream-v3-ios.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Merge fork-only adaptations onto v3.0.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/port-main
          # Current branch was built from the precise upstream v3.0.0 commit.
          git merge-base --is-ancestor 213b17fb1d5751dcd108c7990b32368747e50026 HEAD
          # Apply independent iOS edits using 3-way merge. Where both sides
          # edit the same lines, prefer the newer upstream v3.0.0.
          git merge --no-ff --no-edit -s ort -X ours refs/remotes/origin/port-main
          git diff --name-only 213b17fb1d5751dcd108c7990b32368747e50026 HEAD > /tmp/ios-customizations.txt
          printf "Port adaptations retained: "; wc -l < /tmp/ios-customizations.txt
      - name: Reconcile GameMaker script registration and iOS package version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          project = Path("FVM-reborn.yyp")
          content = project.read_text(encoding="utf-8")
          resource = '    {"id":{"name":"battle_input_helpers","path":"scripts/battle_input_helpers/battle_input_helpers.yy",},},'
          anchor = '    {"id":{"name":"select_shovel","path":"scripts/select_shovel/select_shovel.yy",},},'
          if '"name":"battle_input_helpers"' not in content:
              assert anchor in content, "GameMaker script registration insertion point not found"
              content = content.replace(anchor, resource + "\n" + anchor, 1)
              project.write_text(content, encoding="utf-8")
          assert '"name":"battle_input_helpers"' in project.read_text(encoding="utf-8")
          opts = Path("options/ios/options_ios.yy")
          o = opts.read_text(encoding="utf-8")
          o, n = re.subn(r'("option_ios_version"\s*:\s*")[^"]+(")',r'\g<1>3.0.0\2',o,count=1)
          assert n==1,"iOS version option missing"
          o, n = re.subn(r'("option_ios_build_number"\s*:\s*)\d+',r'\g<1>30000',o,count=1)
          assert n==1,"iOS build number option missing"
          opts.write_text(o,encoding="utf-8")
          workflow=Path(".github/workflows/build-ios-ipa.yml")
          w=workflow.read_text(encoding="utf-8")
          token='          IPA_DIR="$RUNNER_TEMP/ipa"'
          block='''          # Lock the unsigned IPA's displayed version to upstream v3.0.0.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 3.0.0" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 30000" "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "3.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "30000"

'''
          if "Lock the unsigned IPA's displayed version" not in w:
              assert token in w, "IPA packaging insertion point missing"
              w=w.replace(token,block+token,1)
          w=w.replace('RELEASE_TAG="ios-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"',
                      'RELEASE_TAG="ios-v3.0.0-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"')
          w=w.replace('TITLE="FVM-Reborn unsigned iOS build #${GITHUB_RUN_NUMBER}"',
                      'TITLE="FVM-Reborn v3.0.0 unsigned iOS build #${GITHUB_RUN_NUMBER}"')
          workflow.write_text(w,encoding="utf-8")
          PY
      - name: Assert upstream version and essential iOS adaptations
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'global.game_version = "3.0.0"' objects/obj_game_init/Create_0.gml
          grep -q 'battle_apply_speed' scripts/battle_input_helpers/battle_input_helpers.gml
          grep -q 'virtual_pause_pressed' objects/obj_battle_pause_manager/Step_2.gml
          grep -q 'global.pointer_input' objects/obj_card_slot/Step_0.gml
          grep -q 'impact_resolved' objects/obj_flour_sack/Alarm_0.gml
          grep -q 'global.pointer_input' objects/obj_readyroom_manager/Step_0.gml
          grep -q '3.0.0' options/ios/options_ios.yy
          git merge-base --is-ancestor 213b17fb1d5751dcd108c7990b32368747e50026 HEAD
      - name: Commit staged integration
        shell: bash
        run: |
          set -euo pipefail
          git add FVM-reborn.yyp options/ios/options_ios.yy .github/workflows/build-ios-ipa.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(ios): register port inputs and align IPA to v3.0.0"
          fi
          git push origin HEAD:refs/heads/sync/upstream-v3.0.0-base
